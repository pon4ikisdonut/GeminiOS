# GeminiOS `gem` Package Manager Configuration (/etc/gem/gem.conf)

[core]
arch = "x86_64"
db_dir = "/var/lib/gem"
cache_dir = "/var/cache/gem"
root_dir = "/"
parallel_downloads = 4
verify_sha256 = true
ai_assistant = true
geminid_url = "http://127.0.0.1:11435"

[repo.geminios-main]
enabled = true
type = "github-manifest"
# Point this to your forked/hosted GitHub manifest repository
owner = "pon4ikisdonut"
repo = "geminios-repo"
branch = "main"
base_url = "https://raw.githubusercontent.com/pon4ikisdonut/geminios-repo/main"
index_url = "https://raw.githubusercontent.com/pon4ikisdonut/geminios-repo/main/index.json"

[bridge.arch]
enabled = false
mirror = "https://geo.mirror.pkgbuild.com/$repo/os/$arch"
pacman_conf = "/etc/gem/arch-pacman.conf"
repos = ["core", "extra", "multilib"]

[bridge.aur]
enabled = false
rpc_url = "https://aur.archlinux.org/rpc/v5"
helper = "yay"
build_dir = "/var/cache/gem/aur-build"
build_user = "gembuilder"
