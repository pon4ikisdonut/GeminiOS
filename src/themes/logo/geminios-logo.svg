<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3EEFF" />
      <stop offset="25%" stop-color="#A8C7FA" />
      <stop offset="65%" stop-color="#7Cacf8" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>
    <radialGradient id="geminiAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8C7FA" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7Cacf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7Cacf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Official Google G Geometry (48x48 master coordinate space scaled to 456x456 centered in 512x512) -->
  <g transform="translate(28, 28) scale(9.5)">
    <!-- Blue section: crossbar, inner curve, seam to outer arc -->
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <!-- Green section: bottom arc meeting Blue along exact shared line l-7.73-6 -->
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    <!-- Yellow section: left arc -->
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <!-- Red section: top arc -->
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
  </g>

  <!-- Ambient glow circle at the Gemini sparkle location -->
  <circle cx="409" cy="88" r="54" fill="url(#geminiAura)" />

  <!-- The iconic 4-pointed Gemini Diamond Sparkle -->
  <g transform="translate(409, 88)">
    <!-- Star body -->
    <path fill="url(#geminiGrad)" filter="url(#glow)" d="M 0,-64 Q 0,0 64,0 Q 0,0 0,64 Q 0,0 -64,0 Q 0,0 0,-64 Z" />
    <!-- White core highlight -->
    <path fill="#FFFFFF" opacity="0.95" d="M 0,-22 Q 0,0 22,0 Q 0,0 0,22 Q 0,0 -22,0 Q 0,0 0,-22 Z" />
    <!-- Secondary miniature spark -->
    <g transform="translate(48, -48)">
      <path fill="#A8C7FA" opacity="0.85" d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" />
    </g>
  </g>
</svg>
