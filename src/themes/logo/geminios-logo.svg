<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3EEFF" />
      <stop offset="25%" stop-color="#A8C7FA" />
      <stop offset="65%" stop-color="#7Cacf8" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>
    <radialGradient id="geminiAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8C7FA" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7Cacf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7Cacf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Google G base paths, scaled to 512x512 with center alignment -->
  <g transform="translate(34, 34) scale(18.5)">
    <!-- Blue section: crossbar, inner curve, seamless diagonal cut to outer curve, and outer arc -->
    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31l3.57 2.77c2.08-1.92 3.28-4.74 3.28-8.09z"/>
    <!-- Green section: bottom arc meeting Blue seamlessly along (19.28, 20.34) -> (15.71, 17.57) -->
    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
    <!-- Yellow section: left arc -->
    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
    <!-- Red section: top arc terminating into the star -->
    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
  </g>

  <!-- Upper terminal end of G: x = 34 + 19.36 * 18.5 = 392, y = 34 + 3.87 * 18.5 = 105 -->
  <!-- Ambient glow circle -->
  <circle cx="392" cy="105" r="52" fill="url(#geminiAura)" />

  <!-- The iconic 4-pointed Gemini Diamond Sparkle -->
  <g transform="translate(392, 105)">
    <!-- Star body -->
    <path fill="url(#geminiGrad)" filter="url(#glow)" d="M 0,-62 Q 0,0 62,0 Q 0,0 0,62 Q 0,0 -62,0 Q 0,0 0,-62 Z" />
    <!-- White core highlight -->
    <path fill="#FFFFFF" opacity="0.95" d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" />
    <!-- Secondary miniature spark -->
    <g transform="translate(48, -48)">
      <path fill="#A8C7FA" opacity="0.85" d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" />
    </g>
  </g>
</svg>
