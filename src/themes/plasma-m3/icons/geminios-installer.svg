<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F232E" />
      <stop offset="100%" stop-color="#101217" />
    </linearGradient>
    <linearGradient id="driveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3342" />
      <stop offset="100%" stop-color="#1B1E26" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8C7FA" />
      <stop offset="50%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1967D2" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#A8C7FA" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>
    <radialGradient id="sparkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8C7FA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Material 3 Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bgGrad)" stroke="#383E4E" stroke-width="4" filter="url(#shadow)" />

  <!-- Internal Storage Drive Platform -->
  <g transform="translate(0, 20)">
    <rect x="96" y="140" width="320" height="240" rx="32" ry="32" fill="url(#driveGrad)" stroke="#454D60" stroke-width="4" />
    <!-- Connector pins & circuit details -->
    <rect x="136" y="340" width="70" height="16" rx="4" fill="#FDD663" />
    <rect x="220" y="340" width="156" height="16" rx="4" fill="#FDD663" />
    <!-- Heat-sink slots -->
    <line x1="136" y1="180" x2="376" y2="180" stroke="#15171E" stroke-width="6" stroke-linecap="round" />
    <line x1="136" y1="205" x2="376" y2="205" stroke="#15171E" stroke-width="6" stroke-linecap="round" />
    <!-- LED Indicators -->
    <circle cx="360" cy="245" r="7" fill="#34A853" />
    <circle cx="330" cy="245" r="7" fill="#4285F4" />
  </g>

  <!-- Big Installation Arrow pointing down into disk -->
  <path d="M 256,310 L 176,215 L 224,215 L 224,95 L 288,95 L 288,215 L 336,215 Z"
        fill="url(#arrowGrad)" stroke="#E8F0FE" stroke-width="4" filter="url(#arrowGlow)" />

  <!-- Sparkling Gemini Spark Badge in Upper Right -->
  <circle cx="395" cy="105" r="50" fill="url(#sparkAura)" />
  <g transform="translate(395, 105)">
    <path fill="url(#sparkGrad)" d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" />
    <path fill="#FFFFFF" opacity="0.9" d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" />
  </g>
</svg>
