# GeminiOS System AI Daemon Configuration (/etc/geminid/geminid.conf)

[daemon]
host = "127.0.0.1"
port = 11435
log_file = "/var/log/geminid/geminid.log"
audit_log = "/var/log/geminid/agent-audit.log"

[gemini]
# Set during OOBE or via `gemini config set-key <KEY>` (or GEMINI_API_KEY env var)
api_key = ""
model = "gemini-3.5-flash-lite"
pro_model = "gemini-2.5-pro"
api_base = "https://generativelanguage.googleapis.com/v1beta"
timeout_seconds = 30

[fallback]
# Automatic local Gemma fallback via Ollama when user consents & hardware supports it
enabled = false
user_consented = false
ollama_url = "http://127.0.0.1:11434"
model = "auto"
auto_download = true

[agent]
enabled = true
require_confirmation = true
allow_destructive = false
max_steps = 8
